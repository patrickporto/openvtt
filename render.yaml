services:
  - type: web
    name: openvtt-playground
    runtime: static
    buildCommand: npm install -g bun && bun install && bun run build --filter=playground
    staticPublishPath: ./apps/playground/dist
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: 'true'
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /textures/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /environments/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: Cache-Control
        value: no-cache
